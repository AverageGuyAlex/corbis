# Corbis — Netlify-konfigurasjon
#
# Statiske filer ligger i public/ slik at kildekoden til funksjonene og
# node_modules ikke blir publisert som nedlastbare filer.

[build]
  publish = "public"
  functions = "netlify/functions"

# ---------------------------------------------------------------------------
# Cron-jobbene. Tidene er i UTC.
#   05:00 UTC = 07:00 norsk sommertid / 06:00 vintertid
#
# Disse skriver til Netlify Blobs, ikke til repoet — derfor trigger de
# ingen deploy, og koster ingen deploy-credits.
# ---------------------------------------------------------------------------

# Henter nye priser for alle godkjente strekkoder i handlelista.
[functions."refresh"]
  schedule = "0 5 * * *"

# Leter etter nye produkter som matcher varene dine. Tar 15 varer per
# kjøring for å holde seg innenfor tidsgrensen på 30 sekunder.
[functions."discover"]
  schedule = "30 5 * * *"

# ---------------------------------------------------------------------------
# Sikkerhetsheadere. Appen laster ingenting eksternt, så CSP-en kan være streng.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'self'; img-src 'self' https: data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'"

# Produktbilder kommer fra kjedenes egne domener, derfor img-src https: over.

# JS og CSS ligger på faste adresser og endres sammen med HTML-sidene. Med
# max-age beholder nettleseren gamle filer uten å spørre, og kjører gammel JS
# mot en ny side: en tom side, eller en knapp som ikke gjør noe. no-cache betyr
# at den spør Netlify hver gang, og får 304 uten nedlasting når ingenting er
# endret.

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"
